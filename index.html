<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="ВАШ ШТАБ" />
<meta name="theme-color" content="#F4F6F9" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111827'/%3E%3Ctext x='32' y='44' text-anchor='middle' fill='%23FFFFFF' font-family='Arial,sans-serif' font-size='34' font-weight='900'%3E%D0%A8%3C/text%3E%3C/svg%3E" />
<title>ВАШ ШТАБ — Понятный контроль техники и денег</title>
<style>
:root, [data-theme="light"] {
  --bg: #F2F4F7;
  --card: #FFFFFF;
  --card2: #F7F8FA;
  --bd: #E5E9F0;
  --tx: #111827;
  --mu: #64748B;
  --mu2: #94A3B8;
  --or: #F97316;
  --or-s: #FFF3EB;
  --gr: #16A34A;
  --gr-s: #ECFDF3;
  --yl: #D97706;
  --yl-s: #FFFBEB;
  --rd: #DC2626;
  --rd-s: #FEF2F2;
  --bl: #2563EB;
  --bl-s: #EFF6FF;
  --shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
  --shadow-lg: 0 18px 45px rgba(15, 23, 42, 0.16);
  --tank-bg: #E8EDF4;
  --scrim: rgba(15, 23, 42, 0.45);
}
[data-theme="dark"] {
  --bg: #0D1015;
  --card: #161B23;
  --card2: #1E242E;
  --bd: #28303E;
  --tx: #F3F6FA;
  --mu: #94A3B8;
  --mu2: #64748B;
  --or: #FF7828;
  --or-s: rgba(255, 120, 40, 0.14);
  --gr: #22C55E;
  --gr-s: rgba(34, 197, 94, 0.13);
  --yl: #F59E0B;
  --yl-s: rgba(245, 158, 11, 0.14);
  --rd: #EF4444;
  --rd-s: rgba(239, 68, 68, 0.14);
  --bl: #60A5FA;
  --bl-s: rgba(96, 165, 250, 0.14);
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.6);
  --tank-bg: #0D1015;
  --scrim: rgba(0, 0, 0, 0.65);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  min-height: 100%; background: var(--bg); color: var(--tx);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  transition: background .2s, color .2s;
}
.num { font-variant-numeric: tabular-nums; }
svg.ico { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* LAYOUT */
.wrap { max-width: 1080px; margin: 0 auto; padding: 14px 16px calc(92px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }

/* TOP HEADER */
.hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 4px 0; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-ic { width: 38px; height: 38px; border-radius: 12px; background: var(--tx); color: var(--bg); display: grid; place-items: center; font-weight: 900; font-size: 16px; }
.brand-t { font-size: 18px; font-weight: 800; letter-spacing: -.3px; line-height: 1.1; }
.brand-s { font-size: 12px; color: var(--mu); }
.hdr-right { display: flex; align-items: center; gap: 8px; }

.pill-btn {
  height: 38px; padding: 0 13px; border-radius: 12px; border: 1px solid var(--bd); background: var(--card);
  color: var(--tx); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center; gap: 7px; box-shadow: var(--shadow); transition: all .15s;
}
.pill-btn:hover { border-color: var(--or); }
.pill-btn.pri { background: var(--tx); color: var(--bg); border-color: var(--tx); }

/* TOP DESKTOP NAV */
.top-nav { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 5px; box-shadow: var(--shadow); }
.top-nav button {
  flex: 1; height: 40px; border: none; border-radius: 10px; background: transparent; color: var(--mu);
  font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: all .15s;
}
.top-nav button.on { background: var(--tx); color: var(--bg); }
.top-nav button .cnt { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--rd); color: #fff; font-weight: 800; }

/* CARDS */
.card { background: var(--card); border: 1px solid var(--bd); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); }
.sec-title { font-size: 16px; font-weight: 800; letter-spacing: -.2px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sec-title small { font-size: 12px; font-weight: 600; color: var(--mu); }

/* WALLET HERO (Like T-Bank / Apple Wallet!) */
.wallet {
  background: linear-gradient(135deg, #161B26 0%, #222938 100%);
  color: #fff; border-radius: 22px; padding: 20px 22px; box-shadow: 0 12px 30px rgba(15,23,42,.18);
  display: flex; flex-direction: column; gap: 16px;
}
.wallet-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.wallet-lbl { font-size: 13px; color: #A1AEBE; font-weight: 600; }
.wallet-sum { font-size: 36px; font-weight: 900; letter-spacing: -1px; line-height: 1.08; margin-top: 4px; }
.wallet-sub { font-size: 13px; color: #C6D0DC; margin-top: 5px; }
.wallet-sub b { color: #fff; }

.traffic-lights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tl-pill {
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); border-radius: 14px;
  padding: 11px 13px; cursor: pointer; transition: background .15s; text-align: left; color: #fff; font-family: inherit;
}
.tl-pill:hover { background: rgba(255,255,255,.12); }
.tl-pill.on { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.45); }
.tl-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.tl-n { font-size: 20px; font-weight: 800; margin-top: 3px; }
.tl-l { font-size: 12px; color: #B8C4D4; }

/* CLASS FILTER CHIPS */
.cls-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.cls-row::-webkit-scrollbar { display: none; }
.cls-b {
  flex: none; height: 42px; padding: 0 15px; border-radius: 14px; border: 1px solid var(--bd);
  background: var(--card); color: var(--tx); font-size: 13px; font-weight: 700; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px; font-family: inherit; box-shadow: var(--shadow); transition: all .14s;
}
.cls-b.on { background: var(--or); border-color: var(--or); color: #fff; }
.cls-b span.n { font-size: 11.5px; opacity: .75; }

/* PROBLEMS LIST (Human language!) */
.prob-list { display: flex; flex-direction: column; gap: 10px; }
.prob-item {
  display: flex; align-items: center; gap: 13px; padding: 14px 15px; border-radius: 16px;
  border: 1px solid var(--bd); background: var(--card2); cursor: pointer; transition: transform .12s, border-color .15s;
}
.prob-item:hover { border-color: var(--or); transform: translateY(-1px); }
.prob-item.red { background: var(--rd-s); border-color: rgba(220,38,38,.25); }
.prob-item.yel { background: var(--yl-s); border-color: rgba(217,119,6,.25); }
.prob-ic { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; flex: none; }
.prob-ic.red { background: var(--rd); color: #fff; }
.prob-ic.yel { background: var(--yl); color: #fff; }
.prob-main { flex: 1; min-width: 0; }
.prob-h { font-size: 14.5px; font-weight: 800; line-height: 1.25; }
.prob-p { font-size: 12.5px; color: var(--mu); margin-top: 2px; }
.prob-rub { font-size: 15px; font-weight: 800; color: var(--rd); white-space: nowrap; text-align: right; }
.prob-rub small { display: block; font-size: 11px; color: var(--mu); font-weight: 600; }

/* MACHINE CARDS GRID (Native Tank + Clear Hours + Wallet Check!) */
.m-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.m-card {
  background: var(--card); border: 1px solid var(--bd); border-radius: 20px; padding: 16px;
  cursor: pointer; transition: all .15s; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 13px;
}
.m-card:hover { border-color: var(--or); transform: translateY(-2px); }
.m-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.m-title { font-size: 15px; font-weight: 800; line-height: 1.2; }
.m-sub { font-size: 12px; color: var(--mu); margin-top: 2px; }
.m-badge { font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
.mb-gr { background: var(--gr-s); color: var(--gr); }
.mb-yl { background: var(--yl-s); color: var(--yl); }
.mb-rd { background: var(--rd-s); color: var(--rd); }

/* VISUAL FUEL TANK + WORK DAY ROW */
.m-mid { display: flex; align-items: center; gap: 14px; background: var(--card2); border-radius: 14px; padding: 11px 13px; }

/* NATIVE FUEL TANK (real tank silhouette with cap, gauge lines, sliv red slice!) */
.tank-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none; }
.tank-cap { width: 14px; height: 5px; border-radius: 3px 3px 0 0; background: var(--mu2); }
.tank {
  width: 44px; height: 64px; border-radius: 10px; border: 2px solid var(--mu2);
  background: var(--tank-bg); position: relative; overflow: hidden;
}
.tank-liq { position: absolute; left: 0; right: 0; bottom: 0; transition: height .3s; }
.tank-sliv {
  position: absolute; left: 0; right: 0; background: repeating-linear-gradient(45deg, #EF4444, #EF4444 4px, #FCA5A5 4px, #FCA5A5 8px);
  border-top: 1.5px dashed #fff; border-bottom: 1.5px dashed #fff;
}
.tank-mark { position: absolute; right: 3px; width: 7px; height: 1.5px; background: rgba(100,116,139,.45); }
.tank-lbl { font-size: 11px; font-weight: 800; color: var(--tx); }

.day-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.day-line { font-size: 12.5px; display: flex; justify-content: space-between; gap: 6px; }
.day-line span { color: var(--mu); }
.day-strip { height: 10px; border-radius: 99px; background: var(--tank-bg); display: flex; overflow: hidden; }
.ds-w { background: var(--gr); } .ds-i { background: var(--yl); } .ds-o { background: var(--mu2); } .ds-d { background: var(--rd); }

.m-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--bd); }
.m-foot-l { font-size: 12px; color: var(--mu); }
.m-foot-r { font-size: 17px; font-weight: 900; }

/* DETAIL SHEET (Native iOS Bottom Sheet / Modal) */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; right: 16px; top: 16px; bottom: 16px; width: 440px; max-width: calc(100vw - 32px); z-index: 70;
  background: var(--card); border: 1px solid var(--bd); border-radius: 24px; box-shadow: var(--shadow-lg);
  transform: translateX(115%); transition: transform .25s cubic-bezier(.22,1,.36,1);
  display: flex; flex-direction: column; overflow: hidden;
}
.sheet.open { transform: translateX(0); }
.sheet-h { padding: 18px 20px; border-bottom: 1px solid var(--bd); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.sheet-b { flex: 1; overflow-y: auto; padding: 18px 20px 26px; display: flex; flex-direction: column; gap: 14px; }
.x-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--card2); color: var(--tx); cursor: pointer; display: grid; place-items: center; font-size: 18px; }

.receipt { background: var(--card2); border-radius: 16px; padding: 14px 16px; }
.r-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--bd); font-size: 13.5px; }
.r-row:last-child { border-bottom: none; }
.r-row.tot { border-top: 2px solid var(--bd); border-bottom: none; margin-top: 4px; padding-top: 10px; font-size: 16px; font-weight: 900; }

/* SIMPLE MAP */
.s-map { background: var(--card2); border: 1px solid var(--bd); border-radius: 18px; overflow: hidden; }
.s-map svg { width: 100%; height: 380px; display: block; }

/* PRICES */
.price-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--bd); }
.price-row:last-child { border-bottom: none; }
.price-inp {
  width: 112px; height: 42px; text-align: right; font-size: 16px; font-weight: 800; border-radius: 12px;
  border: 1.5px solid var(--bd); background: var(--card2); color: var(--tx); padding: 0 12px; font-family: inherit;
}
.price-inp:focus { outline: none; border-color: var(--or); }

/* TELEGRAM */
.tg-card { max-width: 420px; margin: 0 auto; background: var(--card); border: 1px solid var(--bd); border-radius: 26px; padding: 16px; box-shadow: var(--shadow-lg); }
.tg-msg { background: var(--card2); border-radius: 16px; border-top-left-radius: 4px; padding: 14px; white-space: pre-wrap; font-size: 13px; line-height: 1.55; }
.tg-me { margin-left: auto; max-width: 82%; background: var(--or); color: #fff; font-weight: 700; border-radius: 16px; border-top-right-radius: 4px; padding: 8px 13px; font-size: 12.5px; }

/* IPHONE BOTTOM NAV */
.mob-nav {
  display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  background: var(--card); border-top: 1px solid var(--bd);
  padding: 7px 10px calc(7px + env(safe-area-inset-bottom, 0px));
  grid-template-columns: repeat(4, 1fr); gap: 6px;
}
.mob-nav button {
  min-height: 48px; border: none; border-radius: 12px; background: transparent; color: var(--mu);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit;
}
.mob-nav button.on { background: var(--or-s); color: var(--or); }

.toast {
  position: fixed; left: 50%; bottom: 86px; transform: translateX(-50%) translateY(8px);
  background: var(--tx); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: 13px; font-weight: 700;
  z-index: 95; opacity: 0; pointer-events: none; transition: all .2s;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 820px) {
  .top-nav { display: none; }
  .mob-nav { display: grid; }
  .m-grid { grid-template-columns: 1fr; }
  .traffic-lights { grid-template-columns: 1fr; }
  .wallet-sum { font-size: 30px; }
  .sheet {
    top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-width: 100%; height: 86vh;
    border-radius: 24px 24px 0 0; transform: translateY(100%);
  }
  .sheet.open { transform: translateY(0); }
}
</style>
</head>
<body>
<div class="wrap">
  <!-- HEADER -->
  <header class="hdr">
    <div class="brand">
      <div class="brand-ic">Ш</div>
      <div>
        <div class="brand-t">ВАШ ШТАБ</div>
        <div class="brand-s">Техника и деньги простым языком · Gelios подключён</div>
      </div>
    </div>
    <div class="hdr-right">
      <button class="pill-btn" onclick="toggleTheme()" id="th-btn">Ночной вид</button>
      <button class="pill-btn pri" onclick="exportCsv()">Скачать список</button>
    </div>
  </header>

  <!-- DESKTOP NAV -->
  <nav class="top-nav">
    <button class="on" id="tn-home" onclick="go('home')">Сегодня <span class="cnt" id="cnt-p">4</span></button>
    <button id="tn-map" onclick="go('map')">Где машины</button>
    <button id="tn-prices" onclick="go('prices')">Наши цены</button>
    <button id="tn-tg" onclick="go('tg')">Утро в Telegram</button>
  </nav>

  <main id="root" style="display:flex;flex-direction:column;gap:16px"></main>
</div>

<!-- IPHONE BOTTOM BAR -->
<nav class="mob-nav">
  <button class="on" id="mn-home" onclick="go('home')">
    <svg class="ico" viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    Сегодня
  </button>
  <button id="mn-map" onclick="go('map')">
    <svg class="ico" viewBox="0 0 24 24"><path d="M12 21s-7-5.5-7-11a7 7 0 1 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
    Где машины
  </button>
  <button id="mn-prices" onclick="go('prices')">
    <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 8h4a2.5 2.5 0 0 1 0 5h-4v4m0-4h4.5"/></svg>
    Цены
  </button>
  <button id="mn-tg" onclick="go('tg')">
    <svg class="ico" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    Telegram
  </button>
</nav>

<!-- DETAIL SHEET -->
<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<aside class="sheet" id="sheet">
  <div class="sheet-h">
    <div>
      <div style="font-size:12px;font-weight:700;color:var(--or)" id="sh-cls">—</div>
      <div style="font-size:18px;font-weight:900;margin-top:2px" id="sh-name">—</div>
      <div style="font-size:12.5px;color:var(--mu)" id="sh-sub">—</div>
    </div>
    <button class="x-btn" onclick="closeSheet()" aria-label="Закрыть">✕</button>
  </div>
  <div class="sheet-b" id="sh-body"></div>
</aside>

<div class="toast" id="toast"></div>

<script>
const RATES = { diesel: 70, dumpTon: 185, excHour: 4600, craneHour: 3200, forestM3: 1150 };

const CLS_NAME = { all:'Вся техника', dump:'Самосвалы', exc:'Экскаваторы', crane:'Манипуляторы', forest:'Лесники' };

// Машины простым человеческим языком (без терминов!)
const MACHINES = [

  },

    level:'red', status:'Слили 65 л в тайге на деляне',

  },
  {
    id:'М-04', cls:'crane', name:'Манипулятор Hino 7т', plate:'О 774 НА 154', driver:'Киселёв Рома', place:'Чужая промзона',

  },
  {
    id:'Э-03', cls:'exc', name:'Экскаватор Komatsu PC300', plate:'ТМ 7820 142', driver:'Зотов Андрей', place:'Стройка «Южная»',
    level:'yel', status:'5 часов молотил впустую',
    workH:6.1, idleH:5.2, offH:0, downH:0.7,
    tankCap:600, tankNow:210, burnedL:264, slivL:0,
    doneText:'6,1 часа реальной копки', qty:6.1, fix:15500, wage:8500, rep:0,
    problem:'Мотор тарахтел почти всю смену (11,3 часа), но ковшом реально работал только 6 часов. За 5 часов на холостых сжёг 69 л солярки просто в небо.',
    mx:445, my:295

const f = (n, d=0) => Number(n||0).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d}).replace(/\u202f/g,' ');
function toast(m){ const e=document.getElementById('toast'); e.textContent=m; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2400); }

function calc(m) {
  let rev = 0;
  if (m.cls==='dump') rev = m.qty * RATES.dumpTon;
  else if (m.cls==='exc') rev = m.qty * RATES.excHour;
  else if (m.cls==='crane') rev = m.qty * RATES.craneHour;
  else rev = m.qty * (m.id==='Л-03' ? RATES.forestM3*0.65 : RATES.forestM3);

  const totalFuelL = m.burnedL + m.slivL;
  const fuelRub = totalFuelL * RATES.diesel;
  const slivRub = m.slivL * RATES.diesel;
  const profit = rev - fuelRub - m.wage - m.fix - m.rep;
  const tankPct = Math.round(m.tankNow / m.tankCap * 100);
  const slivPct = Math.round(m.slivL / m.tankCap * 100);
  return { rev, totalFuelL, fuelRub, slivRub, profit, tankPct, slivPct };
}

function toggleTheme() {
  const h = document.documentElement;
  const next = h.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  h.setAttribute('data-theme', next);
  document.getElementById('th-btn').textContent = next === 'light' ? 'Ночной вид' : 'Дневной вид';
}

function go(tab) {
  TAB = tab;
  ['home','map','prices','tg'].forEach(k => {
    const t=document.getElementById('tn-'+k), m=document.getElementById('mn-'+k);
    if (t) t.classList.toggle('on', k===tab);
    if (m) m.classList.toggle('on', k===tab);
  });
  render();
  window.scrollTo({ top:0, behavior:'instant' });
}

function fuelTankHtml(m, c, big=false) {
  const w = big ? 58 : 44, h = big ? 84 : 64;
  const liqColor = m.slivL > 0 ? '#F97316' : (c.tankPct < 30 ? '#EF4444' : '#F59E0B');
  const slivBottom = Math.min(92, c.tankPct);
  const slivH = Math.min(100 - slivBottom, Math.max(c.slivPct, 14));
  return `<div class="tank-wrap">
    <div class="tank-cap"></div>
    <div class="tank" style="width:${w}px;height:${h}px">
      <div class="tank-liq" style="height:${c.tankPct}%;background:linear-gradient(180deg, #FBBF24, ${liqColor})"></div>
      ${m.slivL > 0 ? `<div class="tank-sliv" style="bottom:${slivBottom}%;height:${slivH}%" title="Слили ${m.slivL} л"></div>` : ''}
      <div class="tank-mark" style="top:25%"></div>
      <div class="tank-mark" style="top:50%"></div>
      <div class="tank-mark" style="top:75%"></div>
    </div>
    <div class="tank-lbl num">${m.tankNow} л</div>
  </div>`;
}

          <span><b style="color:var(--rd)">●</b> Слив солярки / чужой объект / рембаза</span>
        </div>
      </div>
    `;
  }

  else if (TAB === 'prices') {
    root.innerHTML = `
      <div class="card">
        <div class="sec-title"><span>Наши расценки (задаёшь один раз)</span><small>Поменяй любую цифру — деньги сразу пересчитаются</small></div>
        <div class="price-row">
          <div><b>Цена солярки</b><div style="font-size:12px;color:var(--mu)">Сколько стоит 1 литр дизеля</div></div>
          <input type="number" class="price-inp num" value="${RATES.diesel}" onchange="RATES.diesel=+this.value||70;toast('Солярка обновлена — всё пересчитано');render()" />
        </div>
        <div class="price-row">
          <div><b>Самосвалы — за 1 тонну</b><div style="font-size:12px;color:var(--mu)">Сколько платит заказчик за тонну</div></div>
          <input type="number" class="price-inp num" value="${RATES.dumpTon}" onchange="RATES.dumpTon=+this.value||185;toast('Пересчитано');render()" />
        </div>
        <div class="price-row">
          <div><b>Экскаваторы — за 1 час работы</b><div style="font-size:12px;color:var(--mu)">Ставка за час реальной копки</div></div>
          <input type="number" class="price-inp num" value="${RATES.excHour}" onchange="RATES.excHour=+this.value||4600;toast('Пересчитано');render()" />
        </div>
        <div class="price-row">
          <div><b>Манипуляторы — за 1 час</b><div style="font-size:12px;color:var(--mu)">Ставка за час работы КМУ</div></div>
          <input type="number" class="price-inp num" value="${RATES.craneHour}" onchange="RATES.craneHour=+this.value||3200;toast('Пересчитано');render()" />
        </div>
        <div class="price-row">
          <div><b>Лесники — за 1 куб леса (м³)</b><div style="font-size:12px;color:var(--mu)">Вывозка и заготовка с деляны</div></div>
          <input type="number" class="price-inp num" value="${RATES.forestM3}" onchange="RATES.forestM3=+this.value||1150;toast('Пересчитано');render()" />
        </div>
      </div>
    `;
  }

  else if (TAB === 'tg') {
    const msg = `Доброе утро! Итоги за вчера (20.11):\n\nВ кармане чистыми: ${totProf>=0?'+':'−'}${f(Math.abs(totProf))} ₽\nПришло ${f(totRev)} ₽ · Ушло ${f(totOut)} ₽\n\nС чем надо разобраться (3):\n1. SHACMAN №17 (Шубин) — ночью слили 85 л солярки (−${f(85*RATES.diesel)} ₽) + поломка КПП.\n2. Лесовоз КАМАЗ №02 (Бобров) — в тайге на деляне слили 65 л (−${f(65*RATES.diesel)} ₽), запись пришла вечером на базе.\n3. Манипулятор Hino (Киселёв) — днём уехал в чужую промзону и 2,5 ч крутил стрелой без заявки.\n\nОстальные 5 машин отработали ровно.`;
    root.innerHTML = `
      <div class="tg-card">
        <div style="display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--bd);margin-bottom:12px">
          <div class="brand-ic" style="border-radius:50%;width:36px;height:36px">Ш</div>
          <div><b style="font-size:14px">ВАШ ШТАБ · Утренний отчёт</b><div style="font-size:12px;color:var(--gr);font-weight:700">приходит сам в 07:00 утра</div></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <div class="tg-msg num">${msg}</div>
          ${TG_EXTRA}
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px">
          <button class="pill-btn" style="justify-content:center" onclick="tgAsk('sliv')">Кто слил солярку?</button>
          <button class="pill-btn" style="justify-content:center" onclick="tgAsk('idle')">Кто стоял без дела?</button>
          <button class="pill-btn" style="justify-content:center" onclick="tgAsk('best')">Кто лучше всех?</button>
          <button class="pill-btn" style="justify-content:center" onclick="TG_EXTRA='';render()">Очистить</button>
        </div>
      </div>
    `;
  }
}

function tgAsk(k) {
  let q='', a='';
  if (k==='sliv') { q='Кто слил солярку?'; a=`• SHACMAN №17 (Шубин): −85 л в 03:14, промзона (−${f(85*RATES.diesel)} ₽)\n• Лесовоз КАМАЗ №02 (Бобров): −65 л на деляне в тайге (−${f(65*RATES.diesel)} ₽)`; }
  else if (k==='idle') { q='Кто стоял без дела?'; a='• Экскаватор Komatsu (Зотов): 5,2 ч молотил впустую (69 л солярки в трубу)\n• Самосвал HOWO №06 (Мухин): 3,8 ч стоял в очереди у экскаватора'; }
  else { q='Кто лучше всех?'; a='• SHACMAN №01 (Ковалёв): 23 рейса, принёс +52 800 ₽ чистыми\n• Харвестер Ponsse (Коршунов): 112 кубов леса, +27 670 ₽\n• Экскаватор CAT 320 (Громов): 10,6 ч копки без простоев'; }
  TG_EXTRA = `<div class="tg-me">${q}</div><div class="tg-msg num">${a}</div>`;
  render();
}

function exportCsv() {
  const h = 'Машина;Водитель;Где;Статус;Сделал;В_баке_л;Сжёг_л;Слили_л;Чистыми_руб';
  const rows = [h].concat(MACHINES.map(m => { const c=calc(m); return [m.name,m.driver,m.place,m.status,m.doneText,m.tankNow,m.burnedL,m.slivL,Math.round(c.profit)].join(';'); }));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'}));
  a.download = 'vash_shtab_otchet.csv'; a.click();
  toast('Список для Excel скачан');
}

render();
</script>
</body>
</html>
